name: CI

# Portão de qualidade. Na main roda como primeiro passo do deploy (deploy.yml chama este arquivo).
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.12-alpine
        env:
          POSTGRES_USER: boramarca
          POSTGRES_PASSWORD: boramarca
          POSTGRES_DB: boramarca_test
        ports: ['5440:5432']
        options: >-
          --health-cmd "pg_isready -U boramarca" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.8.4-alpine
        ports: ['6390:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://boramarca:boramarca@localhost:5440/boramarca_test
      REDIS_URL_TEST: redis://localhost:6390/1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
