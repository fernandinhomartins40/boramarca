# Local development infrastructure. Start with `pnpm dev:infra` (project name: boramarca).
# Host ports avoid ones already used on the dev machine: Postgres 5440, Redis 6390, Evolution 8085.
# Values below are local-only defaults; override them in infra/.env (see .env.example).
name: boramarca

services:
  postgres:
    image: postgres:17.12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boramarca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boramarca}
      POSTGRES_DB: boramarca
    ports:
      - '127.0.0.1:5440:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates boramarca_test (integration tests) and evolution (Evolution API) on first start.
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d boramarca']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.8.4-alpine
    restart: unless-stopped
    # AOF on: BullMQ jobs (deadlines, reminders) survive a restart.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6390:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  evolution:
    # Official image (Evolution API v2), pinned. Check the changelog before bumping.
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:8085:8080'
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8085
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-change-me-evolution-key}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-boramarca}:${POSTGRES_PASSWORD:-boramarca}@postgres:5432/evolution?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: boramarca_evolution
      # Bora Marca keeps its own copy of messages; Evolution stores only what it needs.
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'false'
      DATABASE_SAVE_MESSAGE_UPDATE: 'false'
      DATABASE_SAVE_DATA_CONTACTS: 'false'
      DATABASE_SAVE_DATA_CHATS: 'false'
      DATABASE_SAVE_DATA_LABELS: 'false'
      DATABASE_SAVE_DATA_HISTORIC: 'false'
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: 'false'
      CACHE_LOCAL_ENABLED: 'false'
      CONFIG_SESSION_PHONE_CLIENT: Bora Marca
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: 30
      DEL_INSTANCE: 'false'
      TELEMETRY_ENABLED: 'false'
      LOG_LEVEL: ERROR,WARN,INFO
      LANGUAGE: pt-BR
      # The API registers per-instance webhooks; the global one stays off.
      WEBHOOK_GLOBAL_ENABLED: 'false'
    volumes:
      - evolution_instances:/evolution/instances
    extra_hosts:
      # Lets Evolution call the API running on the host (webhooks to http://host.docker.internal:3333).
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
