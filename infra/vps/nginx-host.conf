# Bora Marca — nginx do HOST da VPS compartilhada. Instalado em /etc/nginx/sites-available/boramarca
# por infra/vps/preparar-vps.sh. Certificado: certbot do host (webroot /var/www/html), renovação automática.
# Site (Next) em 127.0.0.1:3150 e API (Fastify, com WebSocket em /v1/realtime) em 127.0.0.1:3151.
server {
    listen 80;
    listen [::]:80;
    server_name boramarca.com.br www.boramarca.com.br api.boramarca.com.br;

    location /.well-known/acme-challenge/ { root /var/www/html; allow all; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.boramarca.com.br;

    ssl_certificate     /etc/letsencrypt/live/boramarca.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boramarca.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://boramarca.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name boramarca.com.br;

    ssl_certificate     /etc/letsencrypt/live/boramarca.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boramarca.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /.well-known/acme-challenge/ { root /var/www/html; allow all; }

    location / {
        proxy_pass http://127.0.0.1:3150;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.boramarca.com.br;

    ssl_certificate     /etc/letsencrypt/live/boramarca.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boramarca.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;   # áudio de comando de voz e mídia do WhatsApp

    location /.well-known/acme-challenge/ { root /var/www/html; allow all; }

    location / {
        proxy_pass http://127.0.0.1:3151;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;       # WebSocket /v1/realtime
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # A API confia no X-Forwarded-For (TRUST_PROXY=true): só o IP real, nunca o que o cliente mandou
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;   # WebSocket de tempo real fica aberto
        proxy_send_timeout 300s;
    }
}
